services:
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: eink-wall-dashboard
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Berlin}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/config.js').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    container_name: eink-web-renderer
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      dashboard:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - TARGET_URL=${TARGET_URL:-http://dashboard:3000}
      - CRON_JOB=${CRON_JOB:-*/1 * * * *}
      - RENDERING_TIMEOUT=${RENDERING_TIMEOUT:-30000}
      - RENDERING_DELAY=${RENDERING_DELAY:-1000}
      - RENDERING_SCREEN_HEIGHT=${RENDERING_SCREEN_HEIGHT:-825}
      - RENDERING_SCREEN_WIDTH=${RENDERING_SCREEN_WIDTH:-1200}
      - GRAYSCALE_DEPTH=${GRAYSCALE_DEPTH:-8}
    # Use Docker's built-in init process to reap zombie browser processes
    init: true
    # Allocate ample shared memory to prevent Chromium page crashes
    shm_size: "1g"
    # Provide system administration privileges required for Chromium's sandbox features
    cap_add:
      - SYS_ADMIN
